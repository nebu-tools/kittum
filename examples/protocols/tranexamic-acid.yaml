    intervention:
      de: Tranexamsäure intravenös nach der Geburt des Kindes, zusätzlich zu einem Uterotonikum
      en: Intravenous tranexamic acid after the birth of the baby, in addition to a uterotonic
    comparators:
      - id: placebo
        text:
          de: Placebo zusätzlich zu einem Uterotonikum
      - id: uterotonic-alone
        text:
          de: Ein Uterotonikum allein (Oxytocin oder Carbetocin)
      - id: uterotonic-combination
        text:
          de: Eine Kombination von Uterotonika (z. B. Oxytocin mit Misoprostol), nur wenn diese
            die örtliche Standardprophylaxe ist
    comparators_are_alternatives: true
  - id: b2
    label:
