      en: Prevention, caesarean birth
    population:
      de: Frauen bei geplantem oder ungeplantem Kaiserschnitt, ohne Blutung zum Zeitpunkt der
        Randomisierung.
      en: Women having a planned or unplanned caesarean birth, without bleeding at randomization.
    intervention:
      de: Tranexamsäure intravenös während des Kaiserschnitts, zusätzlich zu einem Uterotonikum
      en: Intravenous tranexamic acid during the caesarean, in addition to a uterotonic
    comparators:
      - id: placebo
        text:
          de: Placebo zusätzlich zu einem Uterotonikum
          en: Placebo in addition to a uterotonic
    comparators_are_alternatives: true
outcomes:
  - id: bleeding-death
    category: primary
    name:
      de: Tod durch Blutung
      en: Death due to bleeding
    definition:
      de: Tod durch Blutung innerhalb von 42 Tagen nach der Randomisierung.
      en: Death due to bleeding within 42 days of randomization.
  - id: hysterectomy
    category: secondary
    name:
      de: Hysterektomie zur Blutstillung
