# Tranexamic acid for the treatment and prevention of postpartum haemorrhage. A review written in
# German with English translations, to show a protocol whose default language is not English.
#
# Illustrative. The question follows the public trials of tranexamic acid in obstetric bleeding,
# such as the WOMAN trial, but the questions, criteria, reference set, and trial names here are
# Kittum's own and the identifiers in the reference set are invented. Tranexamic acid is a generic
# medicine on the WHO Model List of Essential Medicines.
#
# The file uses most of the schema: four questions that share two search topics, scope-specific
# criteria, positive and negative examples, keywords, a reference set, a freshness deadline, and a
# second topic in mode M2 with its rationale and validation pack.

schema_version: 1
version_label: "1.0"
default_language: de
title:
  de: Tranexamsäure bei postpartaler Blutung
  en: Tranexamic acid for postpartum haemorrhage
questions:
  - id: a1
    label:
      de: Behandlung, vaginale Geburt
      en: Treatment, vaginal birth
    population:
      de: Frauen mit klinisch diagnostizierter postpartaler Blutung nach vaginaler Geburt.
      en: Women with clinically diagnosed postpartum haemorrhage after vaginal birth.
    intervention:
      de: Tranexamsäure intravenös zusätzlich zur Standardbehandlung
      en: Intravenous tranexamic acid in addition to usual care
    comparators:
      - id: placebo
        text:
          de: Placebo zusätzlich zur Standardbehandlung
          en: Placebo in addition to usual care
      - id: usual-care
        text:
          de: Standardbehandlung allein
          en: Usual care alone
    comparators_are_alternatives: true
  - id: a2
