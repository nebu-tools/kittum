    mode: M2
    mode_rationale:
      de: Ein indirekter Vergleich mit wenigen, gut abgrenzbaren Studien. Eine Person screent
        jeden Datensatz, das KI-Modell ersetzt die zweite Person; jede Abweichung geht in die
        Adjudikation, und 10 % der Ausschlüsse prüft eine zweite Person.
      en: An indirect comparison with few, clearly delimited trials. One person screens every
        record and the AI model replaces the second person; every disagreement goes to
        adjudication, and a second person checks 10% of the exclusions.
    validation_pack: kittum-validation-pack/2026-10
    scopes:
